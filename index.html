function advHomeStrip(){const A=L.filter(act),mo=sum(A,l=>l.emi),ov=A.filter(l=>days(l)<0),ovAmt=sum(ov,l=>l.emi);const X=L.map(an),il=sum(X,x=>x.il);return `<div class="advc"><div class="ah"><h3>Smart Loan Overview</h3><span class="mu">Complete control • offline • mobile ready</span></div><div class="grid"><div class="mini"><span class="mu">Total Debt</span><b>${inr(sum(L,left))}</b></div><div class="mini"><span class="mu">Monthly EMI</span><b>${inr(mo)}</b></div><div class="mini"><span class="mu">Overdue</span><b class="${ov.length?'bad':'ok'}">${inr(ovAmt)}</b></div><div class="mini"><span class="mu">Interest Remaining</span><b>${inr(il)}</b></div></div></div>`}

function detail2(id){const l=L.find(x=>x.id==id);if(!l){go('loans');return ''}F=id;const s=advStats(l),m=meta(l),a=s.a,p=arr(id),pp=parts(id),dc=docs(id);const schedule=Array.from({length:Math.min(+l.n||0,120)},(_,k)=>{const d=due(l,k);return `<div class="row"><span><b>EMI ${k+1}</b><br><span class="mu">${fd(d)}</span></span><span style="text-align:right"><b class="emi">${inr(l.emi)}</b><br><span class="tag">${k<l.paid?'Paid':'Pending'}</span></span></div>`}).join('');return `<div class="r"><button class="t" data-a="backloans">‹ Loans</button><button class="t" data-a="edit" data-id="${id}">Edit</button></div><h1>${esc2(l.lender)}</h1><div class="advc"><div class="ah"><h3>${inr(left(l))}</h3><span class="mu">Current remaining amount</span></div><div class="grid"><div class="mini"><span class="mu">EMI</span><b>${inr(l.emi)}</b></div><div class="mini"><span class="mu">Progress</span><b>${pct(l)}%</b></div><div class="mini"><span class="mu">Interest left</span><b>${inr(a.il)}</b></div><div class="mini"><span class="mu">End date</span><b>${mon(a.end)}</b></div></div></div><div class="c"><div class="row"><span>Loan account</span><b>${esc2(m.account)||'—'}</b></div><div class="row"><span>Sanctioned / Disbursed</span><b>${inr(m.sanctioned)} / ${inr(m.disbursed)}</b></div><div class="row"><span>Interest</span><b>${l.rate||0}% · ${esc2(m.interestType)}</b></div><div class="row"><span>First / End EMI</span><b>${l.first?fd(new Date(l.first+'T00:00:00')):'—'} / ${fd(a.end)}</b></div><div class="row"><span>Principal remaining</span><b>${inr(a.bal)}</b></div></div><div class="r" style="margin:16px 0 8px"><h2 style="margin:0">Payments</h2><button class="pri" data-a="addpay" data-id="${id}">+ Add payment</button></div><div class="c">${p.length?p.slice().reverse().map((x,i)=>`<div class="row"><span><b>${fd(new Date(x.date+'T00:00:00'))}</b><br><span class="mu">${esc2(x.mode||'EMI')} ${x.ref?'· '+esc2(x.ref):''}</span></span><span style="text-align:right"><b>${inr(x.amount)}</b><br><span class="mu">P ${inr(x.principal)} · I ${inr(x.interest)}${x.fee?' · Fee '+inr(x.fee):''}</span></span></div>`).join(''):'<div class="p mu">No manual payment history yet. Existing paid EMIs are tracked by EMI count.</div>'}</div><div class="r" style="margin:16px 0 8px"><h2 style="margin:0">Part Payment / Foreclosure</h2><button data-a="partpay" data-id="${id}">+ Add</button></div><div class="c">${pp.length?pp.slice().reverse().map(x=>`<div class="row"><span><b>${fd(new Date(x.date+'T00:00:00'))}</b><br><span class="mu">${esc2(x.note||'Part payment')}</span></span><span><b>${inr(x.amount)}</b></span></div>`).join(''):'<div class="p mu">No part-payment recorded.</div>'}</div><div class="r" style="margin:16px 0 8px"><h2 style="margin:0">Documents</h2><label class="btn" style="cursor:pointer">+ Add files<input type="file" hidden multiple onchange="window.advDocs(${id},this.files)"></label></div><div class="c">${dc.length?dc.map((x,i)=>`<div class="row"><span>📄 ${aiEsc(x.name)}<br><span class="mu">${fd(new Date(x.added))}</span></span><button class="t d" data-a="deldoc" data-id="${id}" data-i="${i}">Delete</button></div>`).join(''):'<div class="p mu">Sanction letter, KFS, agreement, repayment schedule, NOC etc. ke names yahan save kar sakte ho.</div>'}</div><div class="r" style="margin:16px 0 8px"><h2 style="margin:0">EMI Schedule</h2></div><div class="c">${schedule}</div><div class="c p"><b>Notes</b><p class="mu" style="white-space:pre-wrap;margin-bottom:0">${esc2(m.notes)||'No notes'}</p></div>`}
function addPaymentForm(id){const l=L.find(x=>x.id==id);if(!l)return;const old=document.querySelector('.advPayModal');if(old)old.remove();const d=document.createElement('div');d.className='advPayModal';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:99;padding:24px 14px;display:flex;align-items:flex-end';d.innerHTML=`<div class="c" style="width:100%;max-width:620px;margin:auto;padding:16px;border-radius:22px"><div class="r"><b>Record payment — ${esc2(l.lender)}</b><button class="t" data-a="closemodal">✕</button></div><div class="form2" style="margin-top:10px">${['date','amount','principal','interest','fee','mode','ref'].map((x,i)=>`<div class="fr"><label>${x==='date'?'Payment date':x==='ref'?'Reference no.':x[0].toUpperCase()+x.slice(1)}</label><input id="ap_${x}" type="${x==='date'?'date':['amount','principal','interest','fee'].includes(x)?'number':'text'}" value="${x==='date'?new Date().toISOString().slice(0,10):x==='amount'?l.emi:''}" ${['amount','principal','interest','fee'].includes(x)?'step="any" inputmode="decimal"':''}></div>`).join('')}</div><div class="r" style="margin-top:14px"><button class="pri" data-a="savepay" data-id="${id}" style="flex:1;padding:12px">Save payment</button></div></div>`;document.body.appendChild(d)}
function partPaymentForm(id){const old=document.querySelector('.advPayModal');if(old)old.remove();const d=document.createElement('div');d.className='advPayModal';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:99;padding:24px 14px;display:flex;align-items:flex-end';d.innerHTML=`<div class="c" style="width:100%;max-width:620px;margin:auto;padding:16px;border-radius:22px"><div class="r"><b>Part Payment</b><button class="t" data-a="closemodal">✕</button></div><div class="form2" style="margin-top:10px"><div class="fr"><label>Date</label><input id="pp_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="fr"><label>Amount</label><input id="pp_amount" type="number" step="any" inputmode="decimal"></div><div class="fr full"><label>Note</label><input id="pp_note" value="Part payment"></div></div><div class="r" style="margin-top:14px"><button class="pri" data-a="savepart" data-id="${id}" style="flex:1;padding:12px">Save part payment</button></div></div>`;document.body.appendChild(d)}
window.advDocs=(id,files)=>{ADV.docs[id]=ADV.docs[id]||[];[...files].forEach(f=>ADV.docs[id].push({name:f.name,added:new Date().toISOString()}));advSave();render()}
const oldRender=render;render=function(){if(V==='detail'){$('#app').innerHTML=detail2(F);const n=alerts().length;$('#nv').innerHTML='';return}if(V==='loans'){$('#app').innerHTML=loans2();$('#nv').innerHTML=nav2();return}if(V==='home'){$('#app').innerHTML=home2();$('#nv').innerHTML=nav2();return}oldRender()};
function nav2(){const n=alerts().length;return [['home','Home'],['loans','Loans'],['cal','Calendar'],['ins','Insights'],['bot','Sanhubai'],['set','Settings']].map(a=>`<button class="${V==a[0]?'on':''}" onclick="go('${a[0]}')"><svg viewBox="0 0 24 24">${IC[a[0]]}</svg>${a[1]}${a[0]=='home'&&n?`<i>${n}</i>`:''}</button>`).join('')}
const oldAdd=addv;addv=addv2;
// Advanced click layer runs after the original click handler.
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
if(a==='details'){F=id;V='detail';render();return}
if(a==='backloans'){go('loans');return}
if(a==='addpay'){addPaymentForm(id);return}
if(a==='partpay'){partPaymentForm(id);return}
if(a==='closemodal'){document.querySelector('.advPayModal')?.remove();return}
if(a==='savepay'){const get=x=>document.getElementById('ap_'+x)?.value||'';const p={date:get('date'),amount:num(get('amount')),principal:num(get('principal')),interest:num(get('interest')),fee:num(get('fee')),mode:get('mode')||'EMI',ref:get('ref')};if(!p.amount){toast('Payment amount bharo');return}ADV.payments[id]=ADV.payments[id]||[];ADV.payments[id].push(p);const l=L.find(x=>x.id==id);if(l&&l.paid<l.n&&/emi/i.test(p.mode||'EMI'))l.paid++;advSave();save();document.querySelector('.advPayModal')?.remove();render();return}
if(a==='savepart'){const amount=num(document.getElementById('pp_amount')?.value);if(!amount){toast('Part payment amount bharo');return}ADV.parts[id]=ADV.parts[id]||[];ADV.parts[id].push({date:document.getElementById('pp_date')?.value||new Date().toISOString().slice(0,10),amount,principal:amount,note:document.getElementById('pp_note')?.value||'Part payment'});advSave();document.querySelector('.advPayModal')?.remove();render();return}
if(a==='deldoc'){ADV.docs[id].splice(+b.dataset.i,1);advSave();render();return}
if(a==='save'){
 setTimeout(()=>{const l=ed?L.find(x=>x.id==ed):L[L.length-1];if(!l)return;const g=k=>document.getElementById('f_'+k)?.value??'';ADV.meta[l.id]={account:g('account'),sanctioned:num(g('sanctioned'))||l.principal,disbursed:num(g('disbursed'))||l.principal,interestType:g('interestType')||'Reducing',startDate:g('startDate')||l.first,notes:g('notes')};advSave();render()},30);
}
});

<script>
/* AI Loan Manager — offline diagnostic/calculation engine */
(()=>{
const AIK='loantracker_ai_v1';
let AI={last:null,auto:true};
try{AI=Object.assign(AI,JSON.parse(localStorage.getItem(AIK)||'{}'))}catch(e){}
const aisave=()=>{try{localStorage.setItem(AIK,JSON.stringify(AI))}catch(e){}};
const aiEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>inr(Math.round(Number(n)||0));
function emiCalc(p,r,n){p=+p||0;r=+r||0;n=+n||0;if(p<=0||n<=0)return 0;if(r===0)return p/n;const m=r/1200;return p*m*Math.pow(1+m,n)/(Math.pow(1+m,n)-1)}
function aiAnalyze(){
 const errors=[],warn=[],tips=[],rows=[];
 if(!Array.isArray(L)||!L.length) errors.push('Loan data nahi mila. Kam se kam 1 loan add karein.');
 const seen=new Set();
 L.forEach((l,i)=>{
   const name=l.lender||('Loan #'+(i+1)),p=+l.principal||0,e=+l.emi||0,n=+l.n||0,rate=+l.rate||0,paid=+l.paid||0;
   const calc=emiCalc(p,rate,n),diff=e-calc;
   if(seen.has(String(name).toLowerCase())) warn.push(`${name}: duplicate lender name mil raha hai.`); seen.add(String(name).toLowerCase());
   if(p<=0) errors.push(`${name}: principal/loan amount missing ya 0 hai.`);
   if(e<=0) errors.push(`${name}: EMI amount missing ya 0 hai.`);
   if(n<=0) errors.push(`${name}: total EMI/tenure missing ya 0 hai.`);
   if(rate<0||rate>100) warn.push(`${name}: interest rate ${rate}% unusual hai — document se verify karein.`);
   if(paid<0||paid>n) errors.push(`${name}: paid EMIs ${paid} hain, lekin total EMIs ${n} hain.`);
   if(l.first && isNaN(new Date(l.first).getTime())) errors.push(`${name}: first EMI date invalid hai.`);
   if(p>0&&n>0&&e>0){
     const pctDiff=Math.abs(diff)/(calc||1)*100;
     rows.push({name,entered:e,calc,diff,pctDiff});
     if(rate>0 && pctDiff>5) errors.push(`${name}: EMI mismatch — entered ${money(e)}, reducing-balance calculation approx ${money(calc)} (${pctDiff.toFixed(1)}% difference).`);
     else if(rate===0 && Math.abs(e-(p/n))>2) warn.push(`${name}: rate 0% hone par EMI principal/tenure se match nahi kar rahi.`);
   }
   if(p>0&&e>0&&e<p&&n>0) tips.push(`${name}: EMI principal ke comparison me low hai; tenure/interest document verify karein.`);
   if(rate>=24) tips.push(`${name}: high-rate loan hai; foreclosure/part-prepayment charges check karke interest saving compare karein.`);
 });
 const active=L.filter(act);
 const totalEmi=sum(active,l=>+l.emi||0), totalLeft=sum(active,l=>left(l));
 if(totalEmi>0) tips.push(`Current active loans ki total monthly EMI ${money(totalEmi)} hai.`);
 if(totalLeft>0) tips.push(`Current tracker calculation ke hisaab se remaining scheduled amount approx ${money(totalLeft)} hai.`);
 if(!errors.length) tips.unshift('Loan data basic validation pass kar raha hai.');
 if(!warn.length) tips.push('Koi major warning nahi mili.');
 const result={time:new Date().toISOString(),errors,warn,tips,rows,totalEmi,totalLeft,count:L.length}; AI.last=result; aisave(); return result;
}
function aiReportHTML(r=AI.last||aiAnalyze()){
 const box=(title,items,cls)=>items.length?`<div class="c p"><div class="r"><b>${title}</b><span class="tag">${items.length}</span></div>${items.map(x=>`<div style="padding:10px 0;border-top:.5px solid var(--bd);margin-top:8px" class="${cls}">${aiEsc(x)}</div>`).join('')}</div>`:'';
 const mismatch=(r.rows||[]).filter(x=>x.pctDiff>5);
 return `<div class="advc aiBox"><div class="ah"><div class="r"><div><h3>🤖 AI Loan Manager</h3><div class="mu">Auto reading · calculation · error detection · tips</div></div><span class="tag">${r.errors.length?'⚠️ Check needed':'✓ OK'}</span></div></div><div class="grid"><div class="mini"><span class="mu">Loans scanned</span><b>${r.count}</b></div><div class="mini"><span class="mu">Monthly EMI</span><b>${money(r.totalEmi)}</b></div><div class="mini"><span class="mu">Errors</span><b class="${r.errors.length?'bad':'ok'}">${r.errors.length}</b></div><div class="mini"><span class="mu">Warnings</span><b class="${r.warn.length?'wn':'ok'}">${r.warn.length}</b></div></div><div class="advbtns"><button class="pri" data-a="airun">Run AI Check</button><button data-a="aicalc">Check EMI</button><button data-a="aiclear">Clear AI report</button></div></div>${box('❌ Errors',r.errors,'bad')}${box('⚠️ Warnings',r.warn,'wn')}${box('💡 AI Tips',r.tips,'')}${mismatch.length?`<div class="c p"><b>EMI Calculation Check</b><p class="mu">Formula: reducing-balance EMI using principal, annual rate and tenure. Actual lender schedule may differ due to fees, insurance, dates or other charges.</p>${mismatch.map(x=>`<div class="row" style="padding-left:0;padding-right:0"><span><b>${aiEsc(x.name)}</b><br><span class="mu">Entered ${money(x.entered)} · Calculated ${money(x.calc)}</span></span><span class="bad">${x.pctDiff.toFixed(1)}%</span></div>`).join('')}</div>`:''}<div class="c p"><b>Last AI scan</b><div class="mu" style="margin-top:5px">${r.time?new Date(r.time).toLocaleString('en-IN'):'Not run yet'}</div></div>`;
}
function aiPanel(){return aiReportHTML(AI.last||aiAnalyze())}
const oldSettAI=sett;
sett=function(){return oldSettAI()+`<h2>AI Loan Manager</h2>${aiPanel()}`};
const oldHome2AI=home2;
home2=function(){return oldHome2AI()+`<h2>AI Status</h2>${aiPanel()}`};
window.aiRun=()=>{aiAnalyze();render();toast(AI.last.errors.length?`AI Check: ${AI.last.errors.length} error(s) found`:'AI Check complete — major error nahi mila');};
try{const oldImpAI=imp; if(typeof oldImpAI==='function'){imp=async function(...args){const out=await oldImpAI(...args);setTimeout(()=>{try{aiAnalyze();render()}catch(e){}},50);return out}}}catch(e){}
try{const oldScanAI=scan; if(typeof oldScanAI==='function'){scan=async function(...args){const out=await oldScanAI(...args);setTimeout(()=>{try{aiAnalyze();render()}catch(e){}},80);return out}}}catch(e){}
window.aiCalcOne=(id)=>{const l=L.find(x=>x.id==id);if(!l)return;const c=emiCalc(l.principal,l.rate,l.n);toast(`${l.lender}: EMI approx ${money(c)} · entered ${money(l.emi)}`);};
const oldClickAI=document.addEventListener;
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='airun'){aiRun();return}if(a==='aicalc'){aiRun();return}if(a==='aiclear'){AI.last=null;aisave();render();toast('AI report clear ho gaya');return}});
if(AI.auto) setTimeout(()=>{try{aiAnalyze();render()}catch(e){}},50);
})();
</script>
